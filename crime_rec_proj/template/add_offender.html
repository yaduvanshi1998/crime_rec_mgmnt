<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Offender Info</title>
    <link rel="stylesheet" href="{% static 'add_offender.css' %}">
    <script src="{% static '/add_offender.js' %}"></script>
    <script>
        // Function to display an alert message
        function showAlert(message) {
            alert(message);
        }

    // Check if there's an error message or success message from the server
        window.onload = function() {
            {% if error_message %}
                showAlert("{{ error_message }}");
            {% elif success_message %}
                showAlert("{{ success_message }}");
            {% endif %}
        }
    </script>
</head>
<body>

    <div class="background">
        <div class="form-container">
            <h1>Offender Information</h1>
            <form action="#" method="POST" id="dataForm">
                {% csrf_token %}
                <label for="f_name">First Name:</label>
                <input type="text" id="f_name" name="F_name" placeholder = "Enter the first name of offender" required>

                <label for="l_name">Last Name:</label>
                <input type="text" id="l_name" name="L_name" placeholder = "Enter the last name of offender" required>

                <label for="gender">Gender:</label><br>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Male" required>
                    Male
                </label><br>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Female">
                    Female
                </label><br>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Other">
                    Other
                </label><br>

                <label for="age">Age:</label>
                <input type="text" id="age" name="Age" placeholder = "Enter the age of offender" required>

                <label for="nationality">Nationality:</label>
                <input type="text" id="nationality" name="Nationality" placeholder = "Enter the Nationality of offender" required>

                <label for="address">Address:</label>
                <input type="text" id="address" name="Address" placeholder = "Enter the offender's address" required>

                <label for="phone">Offender Phone No:</label>
                <input type="text" id="phone" name="Phone" placeholder = "Enter the phone number" required>

                <label for="offense_type">Offense Type:</label>
                <select id="offense_type" name="Offense_type" required>
                    <option value="" disabled selected>Select a court</option>
                    <option value="Murder">Murder</option>
                    <option value="Theft">Theft</option>
                    <option value="Half_murder">half Murder</option>
                    <option value="Ragging">Ragging</option>
                    <option value="Ditching">Ditching</option>
                    <option value="Other">Other</option>
                </select>

                <label for="bail_status">Bail Status:</label><br>
                <label>
                    <input type="radio" id = "bail_status" name="Bail_status" value="Jailed" required>
                    Jailed
                </label><br>
                <label>
                    <input type="radio" id = "bail_status" name="Bail_status" value="Released">
                    Released
                </label><br>

                <label for="terms">Jail Terms:</label>
                <input type="text" id="terms" name="Terms" placeholder = "Enter terms of the jail" required>
                
                <!--We are going to fetch the court id with the help of court name, court name will be only in html page
                but inside the judge info table court id will be saved-->
                <label for="court_name">Court Name:</label>
                <select id="court_name" name="Court_name" required>
                    <option value="" disabled selected>Select a court</option>
                    <option value="Queens High Court">Queens High Court</option>
                    <option value="Jackson Heights Court">Jackson Heights Court</option>
                    <option value="JH 73rd st Court">JH 73rd st Court</option>
                </select>

                <label for="victim_no">Victim Phone No:</label>
                <input type="text" id="victim_no" name="Victim_phone" placeholder = "Enter the phone no of victim" required>

                <label for="judge_email">Judge Email:</label>
                <input type="text" id="judge_email" name="Judge_email" placeholder = "Enter the email of judge" required>

                <button type="submit">Submit</button>
            </form>
            <div id="errorMessages"></div>
        </div>
    </div>

</body>
</html>
