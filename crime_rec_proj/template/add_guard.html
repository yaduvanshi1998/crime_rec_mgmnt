<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Guard Info</title>
    <link rel="stylesheet" href="{% static 'add_guard.css' %}">
    <script src="{% static '/add_guard.js' %}"></script>
    <script>
        // Function to display an alert message
        function showAlert(message) {
            alert(message);
        }

    // Check if there's an error message or success message from the server
        window.onload = function() {
            {% if error_message %}
                showAlert("{{ error_message }}");
            {% elif success_message %}
                showAlert("{{ success_message }}");
            {% endif %}
        }
    </script>
</head>
<body>

    <div class="background">
        <div class="form-container">
            <h1>Guard Information</h1>
            <form action="#" method="POST" id="dataForm">
                {% csrf_token %}
                <label for="f_name">First Name:</label>
                <input type="text" id="f_name" name="F_name" placeholder = "Enter the first name of gurad" required>

                <label for="l_name">Last Name:</label>
                <input type="text" id="l_name" name="L_name" placeholder = "Enter the last name of guard" required>

                <label for="gender">Gender:</label>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Male" required>
                    Male
                </label>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Female">
                    Female
                </label>
                <label>
                    <input type="radio" id = "gender" name="Gender" value="Other">
                    Other
                </label>

                <label for="age">Age:</label>
                <input type="text" id="age" name="Age" placeholder = "Enter the age of guard" required>

                <label for="address">Address:</label>
                <input type="text" id="address" name="Address" placeholder = "Enter the gurad's address" required>

                <label for="phone">Phone No:</label>
                <input type="text" id="phone" name="Phone" placeholder = "Enter the phone number" required>

                <label for="shift_start">Shift Start Time:</label>
                <input type="text" id="shift_start" name="Shift_start" placeholder = "Shift start time in HH:MM 24 hr format" required>

                <label for="shift_end">Shift End Time:</label>
                <input type="text" id="shift_end" name="Shift_end" placeholder = "Shift end time in HH:MM 24hr format" required>

                <label for="email">Email:</label>
                <input type="text" id="email" name="Email" placeholder = "Enter the email of guard" required>

                <label for="prison_name">Prison Name:</label>
                <input type="text" id="prison_name" name="Prison_name" placeholder = "Enter the Prison's name" required>

                <button type="submit">Submit</button>
            </form>
            <div id="errorMessages"></div>
        </div>
    </div>

</body>
</html>
