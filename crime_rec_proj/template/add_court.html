<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Court Info</title>
    <link rel="stylesheet" href="{% static 'add_court.css' %}">
    <script src="{% static '/add_court.js' %}"></script>
    <script>
        // Function to display an alert message
        function showAlert(message) {
            alert(message);
        }

    // Check if there's an error message or success message from the server
        window.onload = function() {
            {% if error_message %}
                showAlert("{{ error_message }}");
            {% elif success_message %}
                showAlert("{{ success_message }}");
            {% endif %}
        }
    </script>
</head>
<body>

    <div class="background">
        <div class="form-container">
            <h1>Court Information</h1>
            <form action="#" method="POST" id="dataForm">
                {% csrf_token %}
                <label for="court_id">Court ID:</label>
                <input type="text" id="court_id" name="Court_Id" placeholder = "Should start with CRT (i.e. CRT101)" required>

                <label for="name">Court Name:</label>
                <input type="text" id="name" name="Name" placeholder = "Enter the court name" required>

                <label for="address">Address:</label>
                <input type="text" id="address" name="Address" placeholder = "Enter the court address" required>

                <label for="level">Level:</label>
                <input type="text" id="level" name="Level" placeholder = "Enter the levle of court" required>

                <label for="phone">Phone No:</label>
                <input type="text" id="phone" name="Phone" placeholder = "Enter the phone number" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="Email" placeholder = "Enter the email id of court"required>

                <button type="submit">Submit</button>
            </form>
            <div id="errorMessages"></div>
        </div>
    </div>

</body>
</html>
